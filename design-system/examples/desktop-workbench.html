<!doctype html>
<html lang="zh-CN" data-theme="light">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aham UI · PC 工作台</title>
<link rel="stylesheet" href="../aham-ui.css"><link rel="stylesheet" href="../workbench.css"><link rel="stylesheet" href="../desktop.css">
<style>
html,body{margin:0;height:100%}.demo-page{height:100%;display:flex;flex-direction:column;background:var(--wb-bg);color:var(--wb-ink)}.demo-page header{flex:none}.demo-body{overflow:auto;flex:1}.demo-meta{display:flex;gap:var(--wb-s4);color:var(--wb-muted)}.demo-page section+section{margin-block-start:var(--wb-s6)}.demo-page .wb-form-field p{margin:0;min-height:var(--wb-hit);display:flex;align-items:center}.demo-page [hidden]{display:none!important}.demo-status{color:var(--wb-muted);font-size:var(--wb-text-sm)}.demo-page dialog{width:min(100% - var(--wb-s6),var(--wb-dialog-width));padding:var(--wb-s5);border:1px solid var(--wb-line);border-radius:var(--wb-radius-lg);background:var(--wb-bg);color:var(--wb-ink)}.demo-page dialog::backdrop{background:var(--wb-scrim)}.demo-page dialog footer{display:flex;justify-content:flex-end;gap:var(--wb-s2);margin-block-start:var(--wb-s5)}
</style>
<div class="aham-workbench wb-pc demo-page">
<header class="wb-header"><div class="wb-header-row"><div class="wb-crumbs">询价列表<span>/</span><strong>DEMO-0001</strong></div><span class="wb-spacer"></span><button class="wb-btn sm" id="theme">深色外观</button></div></header>
<header class="wb-page-head"><div class="wb-page-head-lead"><h1>电驱平台支架组件询价</h1><div class="demo-meta"><span class="wb-status"><b></b>待补充</span><span>合成客户甲</span><span>第 1 版询价</span></div></div><div class="wb-page-head-trail"><span class="demo-status" id="status" role="status">阅读</span><button class="wb-btn" id="cancel" hidden>取消编辑</button><button class="wb-btn primary" id="edit">编辑信息</button><button class="wb-btn primary" id="save" hidden>保存信息</button></div></header>
<main class="wb-document demo-body"><section aria-labelledby="basic"><div class="wb-section-head"><h2 id="basic">项目与交期</h2><span class="wb-meta">合成数据 · 本页保存仅更新演示内容</span></div><form id="form" class="wb-form-grid is-reading" novalidate>
<div class="wb-form-field"><label for="name">项目名称 <span aria-hidden="true">*</span></label><p data-read="name">电驱平台配套项目</p><input id="name" name="name" value="电驱平台配套项目" required hidden><span class="wb-form-error" id="name-error" hidden role="alert">请填写项目名称</span></div>
<div class="wb-form-field"><label for="customer">客户名称 <span aria-hidden="true">*</span></label><p data-read="customer">合成客户甲</p><input id="customer" name="customer" value="合成客户甲" required hidden><span class="wb-form-error" id="customer-error" hidden role="alert">请填写客户名称</span></div>
<div class="wb-form-field"><label for="due">报价截止日期</label><p data-read="due">2026-10-30</p><input id="due" name="due" type="date" value="2026-10-30" hidden></div>
<div class="wb-form-field"><label for="currency">报价币种</label><p data-read="currency">人民币</p><select id="currency" name="currency" hidden><option>人民币</option><option>美元</option></select></div>
</form></section>
<section aria-labelledby="parts"><div class="wb-section-head"><h2 id="parts">零件</h2><span class="wb-meta">2 个零件</span></div><div class="wb-table-scroll" role="region" aria-label="零件明细" tabindex="0"><table class="wb-table"><thead><tr><th>零件号 / 名称</th><th>工艺</th><th>材料</th><th class="number">年需求量</th><th class="number">净重（kg）</th><th>确认状态</th></tr></thead><tbody><tr><td><span class="wb-mono">SYN-EV410-001</span><br><span class="wb-meta">左侧安装支架</span></td><td>冲压</td><td>DC04</td><td class="number">96,200</td><td class="number">0.32</td><td>已确认</td></tr><tr><td><span class="wb-mono">SYN-EV410-002</span><br><span class="wb-meta">前端加强板</span></td><td>冲压</td><td>DC04</td><td class="number">83,000</td><td class="number">0.18</td><td>材料牌号待确认</td></tr></tbody></table></div></section></main>
<dialog id="discard" aria-labelledby="discard-title"><h2 id="discard-title">未保存的修改</h2><p>离开编辑后，本次输入将被放弃。</p><footer><button class="wb-btn" id="keep" autofocus>继续编辑</button><button class="wb-btn danger" id="drop">放弃改动</button></footer></dialog>
</div><script src="desktop-workbench.js"></script></html>
