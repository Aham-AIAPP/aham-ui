<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aham UI · 待我审批</title><link rel="stylesheet" href="../aham.css"><style>body{margin:0}</style></head>
<body>
<!-- Worklist (rules/4-页面.md 4.2): quotations waiting for the current user's approval. No filter row; two segments,
     inline 通过 / 退回 on each row, and batch approval with the result rules of rules/6-反馈.md 6.4. Data is fictional. -->
<div class="aham-workbench" data-theme="light" aria-label="待我审批示例">
  <!-- @rail current="i" — generated from examples/_rail.html by scripts/build.mjs -->
  <nav class="wb-rail" id="wb-nav" aria-label="工作空间导航">
    <div class="wb-rail-head"><span class="wb-brand" aria-hidden="true">A</span><span class="wb-brand-name">销售工作空间</span></div>
    <div class="wb-nav-group"><a class="wb-nav-item" href="worklist.html" data-go="i" aria-current="page"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-success"/></svg><span>待办</span><span class="wb-nav-count" aria-label="3 项待处理">3</span></a></div>
    <div class="wb-nav-group" role="group" aria-labelledby="nav-biz"><span class="wb-nav-heading" id="nav-biz">业务</span><a class="wb-nav-item" href="list.html" data-go="c"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-users"/></svg><span>客户</span></a><button type="button" class="wb-nav-item" data-action="placeholder" data-go="o"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-folder"/></svg><span>商机</span></button><a class="wb-nav-item" href="document.html" data-go="q"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-file"/></svg><span>报价</span></a><button type="button" class="wb-nav-item" data-action="placeholder" data-go="h"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-copy"/></svg><span>合同</span></button></div>
    <div class="wb-nav-foot"><a class="wb-nav-item" href="settings.html" data-go="s"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-settings"/></svg><span>设置</span></a><button type="button" class="wb-nav-item wb-nav-user" data-action="account" aria-haspopup="menu" aria-expanded="false" aria-label="账户：林悦" data-tooltip="账户"><span class="wb-avatar-xs" data-cat="4" aria-hidden="true">林</span><span>林悦</span><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-chevron-down"/></svg></button></div>
  </nav>
  <!-- /@rail -->
  <div class="wb-main">
    <header class="wb-header">
      <div class="wb-header-row">
        <div class="wb-header-lead"><button type="button" class="wb-icon-btn" data-action="nav" aria-controls="wb-nav" aria-expanded="false" aria-label="展开侧栏" data-tooltip="展开 / 收起侧栏" data-keys="mod+b"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-menu"/></svg></button><nav class="wb-crumbs" aria-label="当前位置"><span>销售工作空间</span><span>/</span><span aria-current="page">待办</span></nav><div class="wb-seg sm" role="group" aria-label="分类" id="tabs"></div></div>
        <div class="wb-header-trail"><button type="button" class="wb-icon-btn" data-action="theme" aria-pressed="false" aria-label="深色模式" data-tooltip="深色模式"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-moon"/></svg></button></div>
      </div>
      <div class="wb-header-row">
        <div class="wb-header-lead" data-when="idle"><span class="wb-count" id="count"></span></div>
        <div class="wb-header-lead" data-when="bulk" hidden><label class="wb-choice"><input type="checkbox" data-select-all=""><span>全选</span></label><span class="wb-bulk-count" id="bulk-count"></span><button type="button" class="wb-btn sm ghost" data-action="clear-selection">清除选择</button></div>
        <div class="wb-header-trail" data-when="bulk" hidden><button type="button" class="wb-btn sm" data-action="approve-selected">通过选中的报价单</button></div>
      </div>
    </header>
    <div class="wb-layout is-list">
      <section class="wb-list" aria-label="待我审批的报价单">
        <div class="wb-list-scroll" tabindex="0" role="region" aria-label="报价单，可横向滚动">
          <table class="wb-table wb-list-table wb-list-rows" id="table"></table>
          <div class="wb-empty" id="empty" hidden></div>
          <p class="wb-note">报价单、客户和金额均为虚构示例。通过和退回只改当前页面里的数据，刷新后恢复。</p>
        </div>
      </section>
    </div>
  </div>
</div>
<script type="module" src="./worklist.mjs"></script>
</body></html>
