<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aham UI · 记录详情</title><link rel="stylesheet" href="../workbench.css"><style>body{margin:0}</style></head>
<body>
<div class="aham-workbench" data-theme="light" aria-label="记录详情示例">
  <nav class="wb-rail" id="wb-nav" aria-label="工作空间导航">
    <span class="wb-brand" aria-label="Aham CRM">A</span>
    <div class="wb-nav-group"><a class="wb-nav-item" href="customer-list.html" aria-label="客户" aria-current="page"><svg aria-hidden="true"><use href="../icons/aham-icons.svg#i-users"/></svg><span>客户</span></a><button class="wb-nav-item" aria-label="商机" data-action="placeholder"><svg aria-hidden="true"><use href="../icons/aham-icons.svg#i-folder"/></svg><span>商机</span></button><a class="wb-nav-item" href="crm-quotation.html" aria-label="销售报价"><svg aria-hidden="true"><use href="../icons/aham-icons.svg#i-file"/></svg><span>销售报价</span></a><button class="wb-nav-item" aria-label="合同" data-action="placeholder"><svg aria-hidden="true"><use href="../icons/aham-icons.svg#i-copy"/></svg><span>合同</span></button></div>
    <div class="wb-nav-foot"><span class="wb-avatar">林</span></div>
  </nav>
  <div class="wb-main">
    <header class="wb-header">
      <div class="wb-header-row">
        <div class="wb-header-lead"><button type="button" class="wb-icon-btn" data-action="nav" aria-controls="wb-nav" aria-expanded="false" aria-label="展开导航" title="展开 / 收起导航（⌘B · Ctrl+B）"><svg aria-hidden="true"><use href="../icons/aham-icons.svg#i-menu"/></svg></button><nav class="wb-crumbs" aria-label="当前位置"><span>销售工作空间</span><span>/</span><a id="back-link" href="customer-list.html">客户</a><span>/</span><strong aria-current="page" id="crumb-code"></strong></nav></div>
        <div class="wb-header-trail"><div class="wb-record-nav"><span id="record-position"></span><button type="button" class="wb-icon-btn" id="record-prev" aria-label="上一条"><svg aria-hidden="true"><use href="../icons/aham-icons.svg#i-chevron-up"/></svg></button><button type="button" class="wb-icon-btn" id="record-next" aria-label="下一条"><svg aria-hidden="true"><use href="../icons/aham-icons.svg#i-chevron-down"/></svg></button></div><button type="button" class="wb-icon-btn" data-action="theme" aria-pressed="false" aria-label="深色模式"><svg aria-hidden="true"><use href="../icons/aham-icons.svg#i-moon"/></svg></button></div>
      </div>
    </header>
    <div class="wb-detail">
      <div class="wb-detail-scroll" tabindex="0" role="region" aria-label="记录内容">
        <main class="wb-detail-main" id="record-main"></main>
      </div>
      <aside class="wb-panel wb-props" id="record-props" tabindex="0" aria-label="属性"></aside>
    </div>
  </div>
</div>
<script type="module" src="./record-detail.mjs"></script>
</body></html>
