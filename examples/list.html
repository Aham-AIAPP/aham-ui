<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aham UI · 客户列表</title><link rel="stylesheet" href="../aham.css"><style>body{margin:0}</style></head>
<body>
<div class="aham-workbench" data-theme="light" aria-label="客户列表示例">
  <nav class="wb-rail" id="wb-nav" aria-label="工作空间导航">
    <div class="wb-rail-head"><span class="wb-brand" aria-hidden="true">A</span><span class="wb-brand-name">销售工作空间</span></div>
    <div class="wb-nav-group"><a class="wb-nav-item" href="worklist.html" data-go="i"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-success"/></svg><span>待办</span><span class="wb-nav-count" aria-label="3 项待处理">3</span></a></div>
    <div class="wb-nav-group" role="group" aria-labelledby="nav-biz"><span class="wb-nav-heading" id="nav-biz">业务</span><a class="wb-nav-item" href="list.html" data-go="c" aria-current="page"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-users"/></svg><span>客户</span></a><button type="button" class="wb-nav-item" data-action="placeholder" data-go="o"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-folder"/></svg><span>商机</span></button><a class="wb-nav-item" href="document.html" data-go="q"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-file"/></svg><span>报价</span></a><button type="button" class="wb-nav-item" data-action="placeholder" data-go="h"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-copy"/></svg><span>合同</span></button></div>
    <div class="wb-nav-foot"><a class="wb-nav-item" href="settings.html" data-go="s"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-settings"/></svg><span>设置</span></a><span class="wb-nav-item wb-nav-user"><span class="wb-avatar-xs" data-cat="4" aria-hidden="true">林</span><span>林悦</span></span></div>
  </nav>
  <div class="wb-main">
    <header class="wb-header">
      <div class="wb-header-row">
        <div class="wb-header-lead"><button class="wb-icon-btn" data-action="nav" aria-controls="wb-nav" aria-expanded="false" aria-label="展开侧栏" data-tooltip="展开 / 收起侧栏" data-keys="mod+b"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-menu"/></svg></button><nav class="wb-crumbs" aria-label="当前位置"><span>销售工作空间</span><span>/</span><span aria-current="page">客户</span></nav><div class="wb-seg sm" role="group" aria-label="视图" id="views"></div><button type="button" class="wb-btn sm ghost" id="view-save" hidden>另存视图</button></div>
        <div class="wb-header-trail"><button class="wb-icon-btn" data-action="search" aria-label="搜索客户名称或编码" data-tooltip="搜索" data-keys="/"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-search"/></svg></button><label class="wb-search" hidden><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-search"/></svg><input type="search" placeholder="客户名称或编码" aria-label="搜索客户名称或编码" maxlength="100"></label><button class="wb-icon-btn" data-action="theme" aria-pressed="false" aria-label="深色模式" data-tooltip="深色模式"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-moon"/></svg></button><button type="button" class="wb-btn sm primary" id="create-trigger" data-tooltip="新建记录" data-keys="c" aria-keyshortcuts="C">新建</button></div>
      </div>
      <div class="wb-header-row">
        <div class="wb-header-lead" data-when="idle"><span class="wb-count" id="list-count"></span></div>
        <div class="wb-header-trail" data-when="idle"><button type="button" class="wb-btn sm ghost" data-action="export-all">导出</button><button type="button" class="wb-btn sm ghost" id="filter-trigger">筛选</button><button type="button" class="wb-icon-btn" data-panel-toggle="customer-peek" aria-pressed="false" aria-controls="customer-peek" aria-label="预览面板" data-tooltip="预览面板"><svg aria-hidden="true"><use href="../assets/icons/aham-icons.svg#i-eye"/></svg></button><button type="button" class="wb-btn sm ghost" id="display-trigger">显示</button></div>
        <div class="wb-header-lead" data-when="bulk" hidden><label class="wb-choice"><input type="checkbox" data-select-page=""><span>本页全选</span></label><span class="wb-bulk-count" id="bulk-count"></span><button class="wb-btn sm ghost" data-action="select-matching" hidden></button><button class="wb-btn sm ghost" data-action="clear-selection">清除选择</button></div>
        <div class="wb-header-trail" data-when="bulk" hidden><button type="button" class="wb-btn sm ghost" data-action="mass-edit">批量编辑</button><button type="button" class="wb-btn sm ghost" data-action="export">导出</button><button type="button" class="wb-btn sm ghost danger" data-action="delete">删除</button></div>
      </div>
    </header>
    <div class="wb-layout is-list">
      <section class="wb-list" id="customer-list" aria-label="客户列表" data-list-density="standard">
        <div class="wb-filter-bar" id="filter-bar" role="group" aria-label="当前筛选条件" hidden></div>
        <div class="wb-feedback" id="list-feedback" role="status" aria-live="polite"></div>
        <div class="wb-list-scroll" tabindex="0" role="region" aria-label="客户列表，可横向滚动">
          <table class="wb-table wb-list-table wb-list-rows" id="customer-table"></table>
          <div class="wb-empty" id="list-empty" hidden></div>
          <p class="wb-note">所有客户、负责人与金额均为虚构示例。批量编辑、删除和另存的视图只改当前页面里的数据，刷新后恢复。</p>
        </div>
        <footer class="wb-pager" id="pager" aria-label="翻页"></footer>
      </section>
      <aside class="wb-panel" id="customer-peek" data-size="wide" tabindex="0" aria-label="客户预览" hidden></aside>
    </div>
  </div>
</div>
<script type="module" src="./list.mjs"></script>
</body></html>
