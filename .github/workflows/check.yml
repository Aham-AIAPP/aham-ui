name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs --check
      - run: node scripts/lint.mjs
      - run: node scripts/contracts.mjs
      - run: node scripts/theme.mjs --check
      - run: node --test
