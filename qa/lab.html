<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aham UI · 组件与交互实验室</title><link rel="stylesheet" href="../aham.css"><link rel="stylesheet" href="lab.css"><div class="aham-workbench wb-bare lab" data-theme="light"><header><div><span class="eyebrow">AHAM UI / 10.1</span><h1>组件与交互实验室</h1><p>稳定的状态、清楚的反馈、克制的动效。</p></div><div class="actions"><button class="wb-btn" id="theme">切换深浅色</button><a class="wb-btn" href="browser.html">运行回归测试</a></div></header><main><section><div class="section-title"><h2>01 · 按钮状态</h2><span>悬停与按下不改变尺寸；禁用不参与交互</span></div><div id="buttons" class="button-matrix"></div></section><section><div class="section-title"><h2>02 · 编辑与保存</h2><span>首次保存失败，重试成功</span></div><div class="demo"><label for="notes">调研说明</label><textarea class="wb-field" id="notes" rows="3">梳理采购与仓储现状，保留访谈证据和待核对事项。</textarea><div class="actions"><button class="wb-btn primary" id="save">保存更改</button><button class="wb-btn ghost" id="restore">恢复示例</button><span id="save-state" role="status">尚未保存</span></div><p class="wb-value-error" id="save-error" role="alert"></p></div></section><section><div class="section-title"><h2>03 · 组合交互与动效</h2><span>用鼠标和键盘分别体验；遵循系统减少动态效果设置</span></div><div class="actions"><button class="wb-btn" id="create">新建记录</button><button class="wb-btn" id="confirm">确认操作</button><button class="wb-btn" id="picker" aria-haspopup="dialog">阶段：待调研</button><button class="wb-btn" id="ai">生成摘要</button><button class="wb-btn" id="undo">撤销反馈</button></div><div id="ai-host"></div></section><section><div class="section-title"><h2>04 · 组件契约目录</h2><span id="contract-count" role="status"></span><button class="wb-btn sm ghost" id="catalog-retry" hidden>重新加载</button></div><label for="search">查找组件</label><input class="wb-field" id="search" placeholder="名称、状态或关键词"><div id="contracts" class="contracts"></div></section></main><footer>主按钮采用中性色，品牌色保留给焦点与状态。正文 14px · 辅助信息 12px · 图标 16px / 2 · 控件 32px · 菜单 32px</footer></div><script type="module" src="lab.mjs"></script></html>
